server:
  # TCP port the embedded web server listens on.
  port: 8080
  # On SIGTERM, stop accepting new requests and let in-flight ones finish before the context closes.
  shutdown: graceful

spring:
  application:
    # Logical Spring application name, used in logs and management endpoints.
    name: gaming-platform
  mvc:
    async:
      # Max time (ms) Spring MVC waits for an async controller result before timing out the request.
      # Above DynamoDbConfig.API_CALL_TIMEOUT (5s): let the SDK finish or fail with a mapped error first.
      request-timeout: 10000
  lifecycle:
    # Upper bound for each shutdown phase to drain. In-flight DynamoDB calls are themselves bounded
    # by the SDK apiCallTimeout, so the poller and request threads give up well inside this window.
    timeout-per-shutdown-phase: 20s

# Actuator is locked down so only /actuator/health is web-exposed and a profile override cannot
# accidentally surface env, heapdump, configprops, etc. Health shows status only without component
# or disk details to avoid leaking infrastructure information to unauthenticated callers.
management:
  endpoints:
    web:
      exposure:
        # Comma-separated list of actuator endpoints exposed over HTTP. Only health is published.
        include: health
  endpoint:
    health:
      # Detail level of the health endpoint response. never hides component and disk details so only status is shown.
      show-details: never

dynamodb:
  # Required. DynamoDB endpoint URL, either local or https://dynamodb.{region}.amazonaws.com
  endpoint: http://localhost:8000
  # Required. AWS region for the DynamoDB client.
  region: eu-west-1
  # Required. SDK mapping style, either high-level (enhanced client) or low-level.
  client-type: high-level
  # Local dev only. When true, the app creates the tables, enables TTL, and seeds demo players.
  # In production, set false or omit the property. Create the tables beforehand (CDK, CloudFormation,
  # Terraform, or console). The app then only verifies the tables exist at startup.
  create-resources: true
  # Name of the PlayerState table holding the profile, settings, and wallet items for each player.
  player-state-table-name: JavaPlayerState
  # Name of the GameEvent table holding the append-only event log, with a DynamoDB stream and TTL.
  game-events-table-name: JavaGameEvent
  # Name of the Leaderboard table holding the projected top-ranked rows.
  leaderboard-table-name: JavaLeaderboard
  # Seconds until each game event gets ttl = recordedAt + this (DynamoDB deletes eventually). Min 60, max 31536000.
  game-events-ttl-seconds: 7776000
  streams:
    # Optional. Shard iterator type when reading the DynamoDB stream. LATEST (default) reads only new records,
    # TRIM_HORIZON reads from the oldest available record. Sample tests use TRIM_HORIZON.
    iterator-type: LATEST

# Bounded executor and tuning for the Spring MVC async (mvc-async-*) thread pool that completes and
# writes CompletableFuture controller responses. A bounded pool is used instead of Spring's default
# unbounded SimpleAsyncTaskExecutor so a burst cannot spawn one thread per in-flight request.
gaming-platform:
  mvc:
    async:
      # Core number of threads kept alive in the MVC async (mvc-async-*) executor pool.
      core-pool-size: 10
      # Maximum number of threads the MVC async executor pool can grow to under load.
      max-pool-size: 50
      # Number of queued async dispatches allowed before the pool rejects new ones.
      queue-capacity: 100

springdoc:
  api-docs:
    # URL path where the generated OpenAPI JSON document is served.
    path: /api-docs
  # springdoc-openapi defaults to */*. Set application/json so /api-docs matches this JSON API.
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    # URL path where the interactive Swagger UI is served.
    path: /swagger-ui.html
    # Order operations are listed in Swagger UI, sorted by HTTP method.
    operations-sorter: method

---
# Production profile (spring.profiles.active=prod) turns off the interactive API docs. Swagger UI and
# the OpenAPI JSON are a teaching feature here and stay on by default, but in production they are
# usually disabled so the API surface is not advertised.
spring:
  config:
    activate:
      # Profile that must be active for this document block to apply.
      on-profile: prod

springdoc:
  api-docs:
    # Disable serving the OpenAPI JSON document in production.
    enabled: false
  swagger-ui:
    # Disable serving the interactive Swagger UI in production.
    enabled: false
