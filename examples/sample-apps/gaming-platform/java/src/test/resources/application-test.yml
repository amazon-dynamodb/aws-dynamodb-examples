# Active when spring.profiles.active=test (integration and smoke tests).
# dynamodb.endpoint is overridden by AbstractIntegrationTest#dynamoDbProperties.

dynamodb:
  endpoint: http://localhost:8000
  region: eu-west-1
  client-type: high-level
  player-state-table-name: GamingPlayerState
  game-events-table-name: GamingGameEvents
  leaderboard-table-name: GamingLeaderboard
  game-events-ttl-seconds: 7776000
  streams:
    iterator-type: TRIM_HORIZON
