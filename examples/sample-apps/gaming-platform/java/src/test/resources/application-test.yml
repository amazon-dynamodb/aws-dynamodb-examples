# Merged when spring.profiles.active=test (@ActiveProfiles on AbstractIntegrationTest in integration).
# DynamoDbTableTestReset (test profile) deletes / recreates / seeds all three tables before each test method.

dynamodb:
  endpoint: http://localhost:8000    # overridden by AbstractIntegrationTest#dynamoDbProperties
  region: eu-west-1
  client-type: high-level
  player-state-table-name: JavaGamingPlayerState
  game-events-table-name: JavaGamingGameEvents
  leaderboard-table-name: JavaGamingLeaderboard
  game-events-ttl-seconds: 7776000
  streams:
    # Lets integration tests observe INSERTs without relying on LATEST iterator timing.
    iterator-type: TRIM_HORIZON
