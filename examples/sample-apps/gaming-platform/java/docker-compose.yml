services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  gaming-platform-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaming-platform-app
    ports:
      - "8080:8080"
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_REGION: eu-west-1
      DYNAMODB_CLIENTTYPE: ${DYNAMODB_CLIENTTYPE:-high-level}
      DYNAMODB_PLAYERSTATETABLENAME: JavaGamingPlayerState
      DYNAMODB_GAMEEVENTSTABLENAME: JavaGamingGameEvents
      DYNAMODB_LEADERBOARDTABLENAME: JavaGamingLeaderboard
    depends_on:
      - dynamodb-local
    profiles:
      - app
